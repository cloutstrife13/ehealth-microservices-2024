apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-auth-service
spec:
  selector:
    matchLabels:
      app: k8s-auth-service
  template:
    metadata:
      labels:
        app: k8s-auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: DATABASE_URL
              value: "host=postgres user=postgres password=SecurePassword dbname=auth-db port=5432 sslmode=disable"
            - name: FIREBASE_AUTH_EMULATOR_HOST
              value: "firebase-auth:9099"
          ports:
            - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-auth-service
spec:
  type: NodePort
  selector:
    app: k8s-auth-service
  ports:
    - name: auth-service
      port: 80
      nodePort: 30001
      targetPort: 8081
