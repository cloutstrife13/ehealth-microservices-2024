apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-patient-service
spec:
  selector:
    matchLabels:
      app: k8s-patient-service
  template:
    metadata:
      labels:
        app: k8s-patient-service
    spec:
      containers:
        - name: patient-service
          image: patient-service
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 8080
          # Add the environment variable block here:
          env:
            - name: DATABASE_URL
              # This points to the "postgres" service inside your cluster
              # Adjust the username/password/dbname if they differ in your database configuration
              value: "host=postgres user=postgres password=SecurePassword dbname=patients-db port=5432 sslmode=disable"

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-patient-service
spec:
  type: NodePort
  selector:
    app: k8s-patient-service
  ports:
    - name: patient-service
      port: 80
      nodePort: 30000
      targetPort: 8080
