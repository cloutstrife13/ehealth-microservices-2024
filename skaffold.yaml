apiVersion: skaffold/v4beta10
kind: Config
metadata:
  name: ehealth-microservices-2024
build:
  local:
    push: false
  artifacts:
    - image: auth-service
      bazel:
        target: //services/auth-service:container.tar
    # - image: patient-service
    #   bazel:
    #     target: //services/patient-service:container.tar
manifests:
  rawYaml:
    - k8s/auth-service.yaml
    - k8s/postgres.yaml
    - k8s/pubsub.yaml
    - k8s/firebase-auth.yaml
    # - k8s/ingress.yaml
portForward:
  # - resourceType: service
  #   resourceName: k8s-patient-service
  #   port: 80
  #   localPort: 8080
  - resourceType: service
    resourceName: k8s-auth-service
    port: 80
    localPort: 8081

  - resourceType: service
    resourceName: firebase-auth
    port: 9099
    localPort: 9099

  - resourceType: service
    resourceName: firebase-auth
    port: 4000
    localPort: 4000

  - resourceType: service
    resourceName: firebase-auth
    port: 4400
    localPort: 4400
